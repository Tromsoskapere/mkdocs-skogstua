site_name: Skogstua fellesverksted
site_url: https://docs.tromsoskapere.no/ 
repo_url: https://github.com/Tromsoskapere/mkdocs-skogstua/
edit_uri: edit/main/docs/
repo_name: mkdocs-skogstua

theme:
  name: material
  language: nb
  logo: logo.svg
  favicon: logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:

    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Bytt til lyst tema

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Bytt til mørkt tema

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Bytt til lyst tema

  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.action.edit

plugins:
  - awesome-nav
# - section-index
  - pagetree
  - search

extra_css:
  - assets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true